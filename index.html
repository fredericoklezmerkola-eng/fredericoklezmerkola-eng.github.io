<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frederico K. - Portfólio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1e;color:#fff;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
.top{font-weight:800;letter-spacing:2px;padding:15px 20px}
.hero{padding:20px 25px 10px; overflow:visible; max-width:500px; margin:0 auto}
.hero-circle-area{position:relative; width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; padding:55px 15px; overflow:visible; margin:10px 0}
.main-circle{width:68vw; max-width:240px; aspect-ratio:1/1; border-radius:50%; border:3px solid transparent; background:linear-gradient(#0a0f1e,#0a0f1e) padding-box, linear-gradient(135deg,#00f5ff,#a855f7,#ff00aa,#ffaa00) border-box; display:flex; align-items:center; justify-content:center; font-size:20px; z-index:1}
.badge{position:absolute; background:#111c33; border:1px solid #1e2e50; padding:7px 12px; border-radius:20px; font-size:12px; font-weight:700; white-space:nowrap; z-index:5}
.b-design{top:2%; left:50%; transform:translateX(-50%); color:#fde68a}
.b-react{top:14%; right:2%; color:#22d3ee}
.b-cyber{top:32%; right:0%; color:#22d3ee}
.b-web{top:56%; right:0%; color:#fb923c}
.b-webplus{bottom:18%; right:4%; color:#fff}
.b-market{bottom:10%; left:6%; color:#7dd3fc}
.b-foto{left:0%; top:58%; color:#e5e7eb}
.b-stack{left:0%; top:32%; color:#f472b6}
.b-video{left:1%; top:12%; color:#34d399}
h1.title{text-align:center; font-size:2rem; line-height:1.15; background:linear-gradient(90deg,#00f5ff,#a855f7,#ff6ab3); -webkit-background-clip:text; -webkit-text-fill-color:transparent; padding:10px}
.sub{text-align:center; opacity:.7; font-size:14px; margin:10px 0 20px}
.btns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; padding:10px}
.btn1{background:linear-gradient(90deg,#00f5ff,#a855f7); padding:14px 22px; border-radius:30px; text-decoration:none; color:#fff; font-weight:700}
.btn2{border:1px solid #333; padding:14px 22px; border-radius:30px; text-decoration:none; color:#fff}
.sobre{text-align:center; padding:60px 20px 20px; max-width:600px; margin:0 auto}
.sobre p.big{font-size:18px; line-height:1.6; color:#cbd5e1}
.tech-pills{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:30px 0 40px}
.tech-pills span{background:#111c33; border:1px solid #1e2e50; padding:8px 16px; border-radius:20px; font-size:13px; font-weight:600}
.card-dark{background:linear-gradient(180deg,#122040,#0e1a33); border:1px solid #1e335a; border-radius:28px; padding:35px 25px; margin:15px 0; text-align:center}
.skills-section{background:linear-gradient(180deg,#0a2a3a,#0a3a4a); padding:50px 20px 20px}
.cta-card{background:linear-gradient(135deg,#10263d,#2a0a3a,#4a1530); border:1px solid rgba(255,255,255,.1); border-radius:32px; padding:30px 24px; max-width:500px; margin:40px auto}
.cta-card h2{font-size:28px; background:linear-gradient(90deg,#22d3ee,#a855f7,#ec4899); -webkit-background-clip:text; -webkit-text-fill-color:transparent; line-height:1.2}
.cta-card p{color:#94a3b8; margin-top:15px; line-height:1.6}
.cta-btns{display:flex; gap:12px; margin-top:25px; flex-wrap:wrap}
.cta-btns .primary{background:linear-gradient(90deg,#00e5ff,#a855f7); padding:16px 22px; border-radius:18px; color:#fff; text-decoration:none; font-weight:700; display:flex; align-items:center; gap:8px}
.cta-btns .secondary{border:1px solid rgba(255,255,255,.15); padding:16px 22px; border-radius:18px; color:#fff; text-decoration:none; display:flex; gap:8px; align-items:center}
.footer{background:#080d1a; padding:40px 20px; color:#94a3b8}
.footer
