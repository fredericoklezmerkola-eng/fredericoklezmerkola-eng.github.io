<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frederico K. - Portfólio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1e;color:#fff;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
.top{font-weight:800;letter-spacing:2px;padding:15px 20px}
.hero{padding:20px 25px 10px; overflow:visible; max-width:500px; margin:0 auto}
.hero-circle-area{position:relative; width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; padding:55px 15px; overflow:visible; margin:10px 0}
.main-circle{width:68vw; max-width:240px; aspect-ratio:1/1; border-radius:50%; border:3px solid transparent; background:linear-gradient(#0a0f1e,#0a0f1e) padding-box, linear-gradient(135deg,#00f5ff,#a855f7,#ff00aa,#ffaa00) border-box; display:flex; align-items:center; justify-content:center; font-size:20px; z-index:1}
.badge{position:absolute; background:#111c33; border:1px solid #1e2e50; padding:7px 12px; border-radius:20px; font-size:12px; font-weight:700; white-space:nowrap; z-index:5; box-shadow:0 4px 12px rgba(0,0,0,.5)}
.b-design{top:2%; left:50%; transform:translateX(-50%); color:#fde68a}
.b-react{top:14%; right:2%; color:#22d3ee}
.b-cyber{top:32%; right:0%; color:#22d3ee}
.b-web{top:56%; right:0%; color:#fb923c}
.b-webplus{bottom:18%; right:4%; color:#fff}
.b-market{bottom:10%; left:6%; color:#7dd3fc}
.b-foto{left:0%; top:58%; color:#e5e7eb}
.b-stack{left:0%; top:32%; color:#f472b6}
.b-video{left:1%; top:12%; color:#34d399}
h1.title{text-align:center; font-size:2rem; line-height:1.15; background:linear-gradient(90deg,#00f5ff,#a855f7,#ff6ab3); -webkit-background-clip:text; -webkit-text-fill-color:transparent; padding:10px}
.sub{text-align:center; opacity:.7; font-size:14px; margin:10px 0 20px}
.btns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; padding:10px}
.btn1{background:linear-gradient(90deg,#00f5ff,#a855f7); padding:14px 22px; border-radius:30px; text-decoration:none; color:#fff; font-weight:700}
.btn2{border:1px solid #333; padding:14px 22px; border-radius:30px; text-decoration:none; color:#fff}
.sobre{text-align:center; padding:60px 20px 20px; max-width:600px; margin:0 auto}
.sobre p.big{font-size:18px; line-height:1.6; color:#cbd5e1}
.sobre p.big b{color:#fff}
.sobre p.big b.blue{color:#22d3ee}
.prioridades{margin-top:30px; color:#94a3b8; font-size:16px; line-height:1.6}
.tech-pills{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:30px 0 40px}
.tech-pills span{background:#111c33; border:1px solid #1e2e50; padding:8px 16px; border-radius:20px; font-size:13px; font-weight:600}
.card-dark{background:linear-gradient(180deg,#122040,#0e1a33); border:1px solid #1e335a; border-radius:28px; padding:35px 25px; margin:15px 0; text-align:center}
.card-dark .icon{width:60px; height:60px; background:#0a0f1e; border-radius:18px; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:28px}
.card-dark h3{font-size:20px; margin-bottom:12px}
.card-dark p{color:#94a3b8; font-size:15px; line-height:1.5}
.skills-section{background:linear-gradient(180deg,#0a2a3a,#0a3a4a); padding:50px 20px 10px}
.grid-info{display:grid; grid-template-columns:1fr; gap:15px; margin-top:20px}
.mini-card{background:linear-gradient(180deg,#122040,#0e1a33); border:1px solid rgba(255,255,255,.15); border-radius:22px; padding:22px}
.mini-card small{letter-spacing:2px; font-size:11px; opacity:.5; text-transform:uppercase}
.mini-card .num{font-size:32px; font-weight:900; margin-top:8px}
/* CTA E FOOTER NOVO */
.cta-card{background:linear-gradient(135deg,#0f2b3a 0%, #2a0e4a 50%, #3a102a 100%); border:1px solid rgba(255,255,255,.1); border-radius:32px; padding:35px 25px; margin:30px 20px; max-width:500px; margin-left:auto; margin-right:auto}
.cta-card h2{font-size:28px; line-height:1.2; background:linear-gradient(90deg,#00f5ff,#a855f7,#ff00aa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:15px}
.cta-card p{color:#94a3b8; font-size:15px; line-height:1.6; margin-bottom:25px}
.cta-btns{display:flex; gap:12px; flex-wrap:wrap}
.cta-main{background:linear-gradient(90deg,#00d4ff,#8b5cf6); color:#fff; border:none; padding:16px 22px; border-radius:16px; font-weight:700; display:flex; align-items:center; gap:8px; flex:1; justify-content:center; text-decoration:none}
.cta-sec{border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.3); color:#fff; padding:16px 22px; border-radius:16px; font-weight:600; display:flex; align-items:center; gap:8px; flex:1; justify-content:center; text-decoration:none}
.footer{background:#060a14; padding:30px 20px}
